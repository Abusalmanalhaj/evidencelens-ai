services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evidencelens
      POSTGRES_PASSWORD: evidencelens
      POSTGRES_DB: evidencelens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidencelens"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://evidencelens:evidencelens@db:5432/evidencelens
      DATABASE_URL_SYNC: postgresql://evidencelens:evidencelens@db:5432/evidencelens
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
